<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <title>Verifikasi OTP</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests; default-src 'self' https: data: 'unsafe-inline' 'unsafe-eval'"/>
  <meta http-equiv="Strict-Transport-Security" content="max-age=31536000; includeSubDomains"/>
  <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin"/>
  <meta http-equiv="X-Content-Type-Options" content="nosniff" />
  <meta http-equiv="X-Frame-Options" content="SAMEORIGIN" />
  <meta http-equiv="X-XSS-Protection" content="1; mode=block" />
  <meta http-equiv="Permissions-Policy" content="geolocation=(), microphone=(), camera=()" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
  <style>
    :root { --gold:#ffd54f; --brown:#4b3f36; --muted:#8b8179; --link:#0d6efd; }
    body{
      margin:0; min-height:100vh; background:#fff; display:flex; align-items:center; justify-content:center;
      font-family:"Poppins",system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif; color:var(--brown); padding:40px 20px;
    }
    .verify-card{ width:100%; max-width:420px; text-align:center; }
    .lead-text{ color:var(--muted); margin-bottom:28px; font-size:1.05rem; line-height:1.6; }
    .otp-row{ display:flex; justify-content:center; gap:14px; margin-bottom:28px; flex-wrap:wrap; }
    .otp-cell{
      width:54px;height:54px;border-radius:12px;border:2px solid var(--gold);text-align:center;font-size:24px;color:var(--brown);
      background:#fff; outline:none; caret-color:transparent; transition:all .2s ease;
    }
    .otp-cell:focus{ box-shadow:0 0 0 .2rem rgba(255,213,79,.3); }
    .btn-verify{
      display:inline-block; padding:10px 24px; border-radius:12px; border:0; background:var(--gold); color:var(--brown);
      font-weight:600; font-size:.95rem; line-height:1.2; cursor:pointer;
    }
    .resend{ margin-top:16px; display:inline-block; text-decoration:none; color:var(--link); font-weight:500; }
    .resend.disabled{ pointer-events:none; opacity:.5; }
    .notice-wrap{ margin-top:6px; }
    .notice{ margin:4px 0 0; font-size:14px; color:var(--brown); }   /* teks peringatan hitam/coklat tua */
    .notice.hide{ display:none; }
    .notice.success{ font-weight:700; }
    @media (max-width:768px){
      body{ padding:24px 16px; }
      .verify-card{ max-width:360px; }
      .lead-text{ font-size:.95rem; margin-bottom:22px; }
      .otp-row{ gap:10px; margin-bottom:24px; }
      .otp-cell{ width:46px;height:46px;font-size:20px;border-radius:10px; }
      .resend{ font-size:.9rem; }
    }
    @media (max-width:480px){
      .verify-card{ max-width:320px; }
      .lead-text{ font-size:.88rem; margin-bottom:20px; }
      .otp-row{ gap:8px; margin-bottom:20px; }
      .otp-cell{ width:40px;height:40px;font-size:18px;border-radius:8px; }
      .notice{ font-size:13px; }
    }
  </style>
</head>
<body>
  <div class="verify-card">
    <p class="lead-text">Masukkan 6 digit kode OTP<br>yang telah dikirim ke email Anda</p>

    <form id="otpForm" action="../backend/verify_otp.php" method="post" novalidate>
      <input type="hidden" id="email" name="email" />
      <div class="otp-row" id="cells">
        <input type="text" inputmode="numeric" maxlength="1" class="otp-cell"/>
        <input type="text" inputmode="numeric" maxlength="1" class="otp-cell"/>
        <input type="text" inputmode="numeric" maxlength="1" class="otp-cell"/>
        <input type="text" inputmode="numeric" maxlength="1" class="otp-cell"/>
        <input type="text" inputmode="numeric" maxlength="1" class="otp-cell"/>
        <input type="text" inputmode="numeric" maxlength="1" class="otp-cell"/>
      </div>

      <button type="submit" class="btn-verify" id="btnVerify" onclick="return submitOtpManually()">Verifikasi</button>

      <div class="text-center">
        <a href="#" id="resendLink" class="resend disabled" aria-disabled="true">Kirim ulang OTP (05:00)</a>
      </div>

      <div class="notice-wrap">
        <p id="cooldownNote" class="notice hide">Tunggu sebentar sebelum mengirim ulang.</p>
        <p id="alertBox" class="notice hide" role="status" aria-live="polite"></p>
      </div>
    </form>
  </div>

<script>
  const ORIGIN     = location.origin.replace(/^http:\/\//i, "https://");
  const VERIFY_URL = ORIGIN + "/backend/verify_otp.php";
  const LOGIN_URL  = ORIGIN + "/login";
  document.getElementById("otpForm").setAttribute("action", VERIFY_URL);

  const params     = new URLSearchParams(location.search);
  const emailInput = document.getElementById("email");
  const form       = document.getElementById("otpForm");
  const cells      = Array.prototype.slice.call(document.querySelectorAll(".otp-cell"));
  const resendLink = document.getElementById("resendLink");
  const note       = document.getElementById("cooldownNote");
  const alertBox   = document.getElementById("alertBox");
  const btnVerify  = document.getElementById("btnVerify");

  window.__otpHandlerActive = false;

  const emailQS = params.get("email") || "";
  if (emailQS) emailInput.value = emailQS;

  const COOLDOWN = 300; // 5 menit
  function storageKey(email){ return "otp_last_sent_" + (email || "anonymous"); }
  function showAlert(msg){ alertBox.textContent = msg; alertBox.classList.remove("hide"); alertBox.classList.remove("success"); }
  function showSuccess(msg){ alertBox.textContent = msg; alertBox.classList.remove("hide"); alertBox.classList.add("success"); }
  function hideAlert(){ alertBox.textContent = ""; alertBox.classList.add("hide"); alertBox.classList.remove("success"); }
  function onlyDigit(v){ return v.replace(/\D/g,""); }

  cells.forEach(function(c,idx){
    c.addEventListener("input", function(e){
      e.target.value = onlyDigit(e.target.value).slice(0,1);
      if(e.target.value && idx < cells.length-1) cells[idx+1].focus();
    });
    c.addEventListener("keydown", function(e){
      if(e.key==="Backspace" && !e.target.value && idx>0) cells[idx-1].focus();
    });
    c.addEventListener("paste", function(e){
      const t=(e.clipboardData||window.clipboardData).getData("text");
      const d=onlyDigit(t).slice(0,6);
      if(!d) return;
      e.preventDefault();
      cells.forEach((cc,i)=>cc.value=d[i]||"");
      (d.length<6?cells[d.length]:cells[cells.length-1]).focus();
    });
  });

  let tickInt=null;
  function secondsLeftFromStorage(){
    const ts=parseInt(localStorage.getItem(storageKey(emailInput.value))||"0",10);
    if(!ts) return 0;
    const elapsed=Math.floor((Date.now()-ts)/1000);
    return Math.max(0, COOLDOWN-elapsed);
  }
  function fmt(s){ const m=String(Math.floor(s/60)).padStart(2,"0"); const d=String(s%60).padStart(2,"0"); return m+":"+d; }
  function renderCooldown(sec){
    if(sec>0){
      resendLink.textContent="Kirim ulang OTP ("+fmt(sec)+")";
      resendLink.classList.add("disabled");
      resendLink.setAttribute("aria-disabled","true");
      note.classList.remove("hide");
    }else{
      resendLink.textContent="Kirim ulang OTP";
      resendLink.classList.remove("disabled");
      resendLink.removeAttribute("aria-disabled");
      note.classList.add("hide");
    }
  }
  function startCountdown(startSeconds){
    let remaining=startSeconds;
    renderCooldown(remaining);
    clearInterval(tickInt);
    tickInt=setInterval(function(){
      remaining-=1;
      renderCooldown(remaining);
      if(remaining>0){
        const backTs=Date.now()-(COOLDOWN-remaining)*1000;
        localStorage.setItem(storageKey(emailInput.value), String(backTs));
      }
      if(remaining<=0) clearInterval(tickInt);
    },1000);
  }

  // ======= INIT TANPA AUTO-RESEND =======
  const initLeft = secondsLeftFromStorage();
  const paramSent = params.get("sent")==="1";
  if(initLeft>0){
    startCountdown(initLeft);
  }else if(paramSent){
    localStorage.setItem(storageKey(emailInput.value), String(Date.now()));
    startCountdown(COOLDOWN);
  }else{
    renderCooldown(0); // tombol resend aktif, tidak auto kirim
  }

  // ======= RESEND (hanya saat user klik) =======
  async function requestResendOtp(){
    if(!emailInput.value){ showAlert("Email tidak valid."); return; }
    try{
      const url = new URL(VERIFY_URL);
      url.searchParams.set("resend","1");
      url.searchParams.set("email", emailInput.value);
      const res = await fetch(url.toString(), {
        method:"GET",
        headers:{ "X-Requested-With":"XMLHttpRequest", "Accept":"application/json" },
        cache:"no-store", redirect:"follow", referrerPolicy:"strict-origin-when-cross-origin"
      });
      const data = await res.json().catch(()=>({}));
      if(res.ok && data.ok){
        localStorage.setItem(storageKey(emailInput.value), String(Date.now()));
        startCountdown(COOLDOWN);
        hideAlert();
        return;
      }
      if(res.status===429 && data?.error==="cooldown"){
        const wait=parseInt(data.wait||"0",10);
        if(wait>0){
          const backTs=Date.now()-(COOLDOWN-wait)*1000;
          localStorage.setItem(storageKey(emailInput.value), String(backTs));
          startCountdown(wait);
        }
        showAlert("Tunggu sebentar sebelum mengirim ulang.");
        return;
      }
      showAlert(data?.error ? ("Gagal mengirim OTP: "+data.error) : "Gagal mengirim OTP.");
    }catch{
      showAlert("Jaringan bermasalah. Coba lagi.");
    }
  }
  resendLink.addEventListener("click", function(e){
    if(resendLink.classList.contains("disabled")){ e.preventDefault(); return; }
    e.preventDefault();
    showAlert("Kode OTP baru dikirim ke email (jika tersedia).");
    localStorage.setItem(storageKey(emailInput.value), String(Date.now()));
    startCountdown(COOLDOWN);
    requestResendOtp();
  });

  // ======= VERIFY =======
  form.addEventListener("submit", async function(e){
    window.__otpHandlerActive = true;
    e.preventDefault();
    const otp = cells.map(c=>c.value).join("");
    if(otp.length!==6){ showAlert("Masukkan 6 digit OTP."); return; }
    btnVerify.disabled=true; hideAlert();
    try{
      const fd = new FormData();
      fd.append("email", emailInput.value);
      fd.append("otp", otp);
      const res = await fetch(VERIFY_URL, {
        method:"POST", body:fd, headers:{ "X-Requested-With":"XMLHttpRequest" },
        cache:"no-store", redirect:"follow", referrerPolicy:"strict-origin-when-cross-origin"
      });
      if(res.headers.get("content-type")?.includes("application/json")){
        const data = await res.json().catch(()=>({}));
        if(res.ok && data.ok){
          showSuccess("Pendaftaran akun telah berhasil. Silakan login…");
          btnVerify.disabled = true;
          resendLink.classList.add("disabled");
          resendLink.setAttribute("aria-disabled","true");
          setTimeout(()=>{ window.location.href = data.redirect || LOGIN_URL; }, 2000);
          return;
        }
        const map={ invalid_input:"Input tidak valid.", not_found:"Akun tidak ditemukan.",
                    already_active:"Akun sudah aktif, silakan login.", wrong:"OTP salah.",
                    expired:"OTP kedaluwarsa. Silakan kirim ulang." };
        showAlert(map[data?.error] || data?.error || "Verifikasi gagal. Coba lagi.");
        return;
      }
      if(res.ok){
        showSuccess("Pendaftaran akun telah berhasil. Silakan login…");
        setTimeout(()=>{ window.location.href = LOGIN_URL; }, 2000);
        return;
      }
      showAlert("Verifikasi gagal. Coba lagi.");
    }catch{
      showAlert("Jaringan bermasalah. Coba lagi.");
    }finally{
      btnVerify.disabled=false;
    }
  });

  // Fallback bila listener tidak terpasang
  function submitOtpManually(){
    if(window.__otpHandlerActive) return true;
    let otp=""; document.querySelectorAll(".otp-cell").forEach(c=>otp+=c.value||"");
    if(otp.length!==6){ alert("Masukkan 6 digit OTP."); return false; }
    const hid=document.createElement("input"); hid.type="hidden"; hid.name="otp"; hid.value=otp;
    form.appendChild(hid); form.action=VERIFY_URL; return true;
  }
  window.submitOtpManually = submitOtpManually;
</script>
</body>
</html>
